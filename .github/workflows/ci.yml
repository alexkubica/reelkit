name: Test portable renderer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Check runtime and run real-render tests
        run: |
          reelkit doctor
          python -m pytest
      - name: Exercise both starter languages
        run: |
          reelkit init demo-english
          reelkit validate demo-english/project.json
          reelkit init demo-hebrew --language he
          reelkit validate demo-hebrew/project.json
          reelkit render demo-hebrew/project.json --draft
      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m build
      - name: Check the public reel catalog
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/build_library.py --check
